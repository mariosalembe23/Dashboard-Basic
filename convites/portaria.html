<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portaria do Evento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .layout { max-width: 980px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { text-align: center; padding: 14px 8px; }
    .stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    #leitor { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 240px; }
    .resultado { border-radius: var(--radius); padding: 22px; color: #fff; text-align: center; min-height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 4px; transition: background .2s; background: var(--muted); }
    .resultado .icone { font-size: 40px; line-height: 1; }
    .resultado .titulo { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .resultado .nome { font-size: 20px; font-weight: 600; }
    .resultado .det { font-size: 14px; opacity: .9; }
    .resultado.ok { background: var(--ok); }
    .resultado.dup { background: var(--warn); }
    .resultado.inv { background: var(--err); }
    .linha { display: flex; gap: 8px; }
    .linha input { flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    td .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--line); }
    td .tag.in { background: #dcfce7; color: #166534; }
    .tabela { max-height: 420px; overflow: auto; }
    .aviso { font-size: 12px; color: var(--muted); }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topo">
    <div class="wrap">
      <a class="marca" href="index.html">Convite<span>Certo</span></a>
      <nav class="nav">
        <a href="index.html#modelos">Modelos</a>
        <a href="gerador.html">Gerador</a>
        <a href="portaria.html" class="ativo">Portaria</a>
      </nav>
    </div>
  </header>

  <div class="layout">
    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="cartao">
        <h2 style="font-size:20px">Lista do evento</h2>
        <label for="fCsv">Importar <code>portaria.csv</code> (gerado no Gerador)</label>
        <input type="file" id="fCsv" accept=".csv,.txt">
        <div class="aviso" id="infoEvento" style="margin-top:8px">Nenhum evento carregado.</div>
      </section>

      <div class="stats">
        <div class="cartao stat"><b id="sTotal">0</b><span>Convidados</span></div>
        <div class="cartao stat"><b id="sEntr">0</b><span>Entraram</span></div>
        <div class="cartao stat"><b id="sFalta">0</b><span>Por chegar</span></div>
      </div>

      <section class="cartao">
        <div id="leitor"></div>
        <div class="linha" style="margin-top:12px">
          <button class="btn prim" id="bCam" style="flex:1">Iniciar câmara</button>
        </div>
        <div class="linha" style="margin-top:10px">
          <input id="fCodigo" placeholder="Código manual (ex.: K7M3QX2A)" autocapitalize="characters">
          <button class="btn" id="bValidar">Validar</button>
        </div>
        <p class="aviso">A câmara só funciona em páginas <b>https</b> (ou localhost).</p>
      </section>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="resultado" id="res">
        <div class="icone">📷</div>
        <div class="titulo">PRONTO A LER</div>
        <div class="det">Aponte a câmara ao QR code do convite</div>
      </div>

      <section class="cartao">
        <div class="linha" style="align-items:center;justify-content:space-between;margin-bottom:10px">
          <h2 style="font-size:20px;margin:0">Convidados</h2>
          <button class="btn sm" id="bExport">Exportar relatório</button>
        </div>
        <input id="fBusca" placeholder="Procurar por nome…">
        <div class="tabela" style="margin-top:10px">
          <table>
            <thead><tr><th>Nome</th><th>Mesa</th><th>Estado</th><th></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    /*
     * PROTÓTIPO: os registos de entrada ficam guardados neste telemóvel (localStorage).
     * Com vários agentes em portas diferentes é preciso um servidor central para que
     * um código lido na porta A seja recusado na porta B — ver README.md.
     */
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let ev = { id: null, convidados: {}, entradas: {} };

    const guardar = () => { try { localStorage.setItem("portaria:atual", JSON.stringify(ev)); } catch {} };
    try { const s = JSON.parse(localStorage.getItem("portaria:atual")); if (s && s.id) ev = s; } catch {}

    function parseCSV(txt) {
      const linhas = txt.replace(/^﻿/, "").split(/\r?\n/).filter((l) => l.trim());
      const sep = linhas[0].includes(";") ? ";" : ",";
      const split = (l) => l.split(sep).map((v) => v.trim().replace(/^"|"$/g, "").replace(/""/g, '"'));
      const cab = split(linhas.shift()).map((c) => c.toLowerCase());
      return linhas.map((l) => { const v = split(l); const o = {}; cab.forEach((c, i) => (o[c] = v[i] || "")); return o; });
    }

    $("fCsv").onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const rows = parseCSV(await f.text()).filter((r) => r.codigo);
      if (!rows.length) { mostrar("inv", "❌", "FICHEIRO INVÁLIDO", "", "O CSV precisa da coluna 'codigo'"); return; }
      const id = rows[0].evento_id || "SEM_ID";
      if (ev.id && ev.id !== id && Object.keys(ev.entradas).length && !confirm("Já existe outro evento com entradas registadas. Substituir?")) return;
      const anteriores = ev.id === id ? ev.entradas : {};
      ev = { id, convidados: {}, entradas: anteriores };
      rows.forEach((r) => { ev.convidados[r.codigo.toUpperCase()] = { nome: r.nome, mesa: r.mesa, acompanhantes: r.acompanhantes }; });
      guardar();
      atualizar();
    };

    function mostrar(cls, icone, titulo, nome, det) {
      const r = $("res");
      r.className = "resultado " + cls;
      r.innerHTML = `<div class="icone">${icone}</div><div class="titulo">${esc(titulo)}</div>${nome ? `<div class="nome">${esc(nome)}</div>` : ""}<div class="det">${esc(det)}</div>`;
      if (navigator.vibrate) navigator.vibrate(cls === "ok" ? 80 : [200, 80, 200]);
    }

    function validar(texto) {
      if (!ev.id) { mostrar("inv", "⚠️", "SEM LISTA", "", "Importe primeiro o portaria.csv"); return; }
      const p = String(texto).trim().split("|");
      const [eventoId, codigo] = p.length === 3 && p[0] === "CNV1" ? [p[1], p[2].toUpperCase()] : [null, String(texto).trim().toUpperCase()];
      if (eventoId && eventoId !== ev.id) { mostrar("inv", "❌", "OUTRO EVENTO", "", "Este convite não pertence a este evento"); return; }
      const c = ev.convidados[codigo];
      if (!c) { mostrar("inv", "❌", "CONVITE INVÁLIDO", "", `Código ${codigo} não existe na lista`); return; }
      const hora = ev.entradas[codigo];
      if (hora) {
        mostrar("dup", "⛔", "JÁ UTILIZADO", c.nome, `Entrou às ${new Date(hora).toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" })} — possível duplicado`);
        return;
      }
      ev.entradas[codigo] = Date.now();
      guardar();
      const extra = [c.mesa && `Mesa ${c.mesa}`, Number(c.acompanhantes) > 0 && `+${c.acompanhantes} acompanhante(s)`].filter(Boolean).join(" · ");
      mostrar("ok", "✅", "BEM-VINDO(A)", c.nome, extra || "Entrada registada");
      atualizar();
    }

    function atualizar() {
      const total = Object.keys(ev.convidados).length;
      const entr = Object.keys(ev.entradas).filter((k) => ev.convidados[k]).length;
      $("sTotal").textContent = total; $("sEntr").textContent = entr; $("sFalta").textContent = total - entr;
      $("infoEvento").textContent = ev.id ? `Evento ${ev.id} · ${total} convidados` : "Nenhum evento carregado.";
      const q = $("fBusca").value.trim().toLowerCase();
      $("tbody").innerHTML = Object.entries(ev.convidados)
        .filter(([, c]) => !q || c.nome.toLowerCase().includes(q))
        .sort((a, b) => a[1].nome.localeCompare(b[1].nome))
        .map(([cod, c]) => {
          const h = ev.entradas[cod];
          return `<tr><td>${esc(c.nome)}</td><td>${esc(c.mesa)}</td>
            <td>${h ? `<span class="tag in">${new Date(h).toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" })}</span>` : `<span class="tag">—</span>`}</td>
            <td>${h ? "" : `<button class="btn sm" data-c="${esc(cod)}">Entrada</button>`}</td></tr>`;
        }).join("");
    }
    $("fBusca").oninput = atualizar;
    $("tbody").onclick = (e) => { const b = e.target.closest("button[data-c]"); if (b) validar(b.dataset.c); };
    $("bValidar").onclick = () => { validar($("fCodigo").value); $("fCodigo").value = ""; };
    $("fCodigo").onkeydown = (e) => { if (e.key === "Enter") $("bValidar").click(); };

    $("bExport").onclick = () => {
      const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const l = [["codigo", "nome", "mesa", "entrou", "hora"].join(";")];
      Object.entries(ev.convidados).forEach(([cod, c]) => {
        const h = ev.entradas[cod];
        l.push([cod, c.nome, c.mesa, h ? "sim" : "não", h ? new Date(h).toLocaleString("pt-PT") : ""].map(q).join(";"));
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + l.join("\n")], { type: "text/csv;charset=utf-8" }));
      a.download = `relatorio_entradas_${ev.id || "evento"}.csv`;
      a.click();
    };

    /* Câmara */
    let leitor = null, ultimo = "", ultimoT = 0;
    $("bCam").onclick = async () => {
      if (leitor && leitor.isScanning) { await leitor.stop(); $("bCam").textContent = "Iniciar câmara"; return; }
      leitor = leitor || new Html5Qrcode("leitor");
      try {
        await leitor.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 240, height: 240 } }, (txt) => {
          const agora = Date.now();
          if (txt === ultimo && agora - ultimoT < 3000) return; // ignora a mesma leitura repetida
          ultimo = txt; ultimoT = agora;
          validar(txt);
        });
        $("bCam").textContent = "Parar câmara";
      } catch (err) {
        mostrar("inv", "📷", "SEM CÂMARA", "", "Permita o acesso à câmara (requer https)");
      }
    };

    atualizar();
  </script>
</body>
</html>
